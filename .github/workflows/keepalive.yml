# Mantém o Supabase gratuito ativo: chama /api/keepalive a cada 6 horas.
# Configure em Settings > Secrets and variables > Actions:
#   - secret   CRON_SECRET  (o mesmo valor cadastrado na Vercel)
#   - variable SITE_URL     (obrigatória: endereço do app na Vercel)
name: Manter banco ativo

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar keepalive
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "Variável SITE_URL não configurada"; exit 1; fi
          for i in 1 2 3; do
            code=$(curl -s -o resp.json -w "%{http_code}" -m 60 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/keepalive")
            cat resp.json; echo
            if [ "$code" = "200" ]; then exit 0; fi
            echo "Tentativa $i falhou (HTTP $code); tentando de novo em 60s"; sleep 60
          done
          exit 1
